[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24.15.0"

[build.processing]
  skip_processing = false

[build.processing.css]
  bundle = true
  minify = true

[build.processing.js]
  bundle = true
  minify = true

[build.processing.html]
  pretty_urls = true

# The blog moved from its own subdomain to bwh.tech/blog.
[[redirects]]
  from = "https://blog.bwh.tech/*"
  to = "https://bwh.tech/blog/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.bwh.tech/*"
  to = "https://bwh.tech/:splat"
  status = 301
  force = true

# Posts used to sit at the site root, before the root became the landing page.
[[redirects]]
  from = "/announcements/*"
  to = "/blog/announcements/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/engineering/*"
  to = "/blog/engineering/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/stories/*"
  to = "/blog/stories/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/thoughts/*"
  to = "/blog/thoughts/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/tips-and-tricks/*"
  to = "/blog/tips-and-tricks/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/tutorial/*"
  to = "/blog/tutorial/:splat"
  status = 301
  force = true

