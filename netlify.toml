[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24.15.0"

[build.processing]
  skip_processing = false

[build.processing.css]
  bundle = true
  minify = true

[build.processing.js]
  bundle = true
  minify = true

[build.processing.html]
  pretty_urls = true

[[redirects]]
  from = "/how-i-became-a-developer/"
  to = "/stories/how-i-became-a-developer/"
  status = 301
  force = true

[[redirects]]
  from = "/how-i-ended-up-at-mini-frappe/"
  to = "/stories/how-i-ended-up-at-mini-frappe/"
  status = 301
  force = true

[[redirects]]
  from = "/introducing-bwh-studios/"
  to = "/announcements/introducing-bwh-studios/"
  status = 301
  force = true

[[redirects]]
  from = "/my-journey-from-django-to-frappe-framework/"
  to = "/stories/my-journey-from-django-to-frappe-framework/"
  status = 301
  force = true

[[redirects]]
  from = "/bwh-2024-recap/"
  to = "/thoughts/bwh-2024-recap/"
  status = 301
  force = true

[[redirects]]
  from = "/frappeverse-2024-top-10-announcements/"
  to = "/announcements/frappeverse-2024-top-10-announcements/"
  status = 301
  force = true

[[redirects]]
  from = "/five-ui-ux-things/"
  to = "/tips-and-tricks/five-ui-ux-things/"
  status = 301
  force = true

[[redirects]]
  from = "/one-year/"
  to = "/announcements/one-year/"
  status = 301
  force = true

[[redirects]]
  from = "/the-learn-apply-cycle/"
  to = "/thoughts/the-learn-apply-cycle/"
  status = 301
  force = true

[[redirects]]
  from = "/system-console-is-your-friend/"
  to = "/tips-and-tricks/system-console-is-your-friend/"
  status = 301
  force = true

[[redirects]]
  from = "/clean-and-dry-templates-with-jinja-macros-filters-and-methods-in-frappe-framework/"
  to = "/tutorial/clean-and-dry-templates-with-jinja-macros-filters-and-methods-in-frappe-framework/"
  status = 301
  force = true

[[redirects]]
  from = "/stop-using-get-doc-for-everything/"
  to = "/tips-and-tricks/stop-using-get-doc-for-everything/"
  status = 301
  force = true

[[redirects]]
  from = "/top-10-announcements-from-frappeverse-2023/"
  to = "/announcements/top-10-announcements-from-frappeverse-2023/"
  status = 301
  force = true

[[redirects]]
  from = "/blog"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/blog/*"
  to = "/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self'; font-src 'self' data:; frame-src https://www.youtube.com; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'"
    Permissions-Policy = "camera=(), geolocation=(), microphone=()"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/blog-media/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/authors/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
